version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/divmora/localharness/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: gui/src/gen
    opt: target=ts
