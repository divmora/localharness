# Zenith Configuration
# Copy this file to one of:
#   .zenith/config.yml          (per-workspace, highest priority)
#   ~/.divmora/agents/zenith/config.yml (global, lowest priority)
#
# Priority: CLI flags > env vars > workspace config > global config
# API keys are always read from environment variables (never put keys in this file).

# ── Global Defaults ──────────────────────────────────────────────────────────
# These apply to all personas unless overridden below.

endpoint: default-endpoint          # Endpoint name defined in litellm.json
model: gpt-4o                       # Model name override
# base_url: https://api.openai.com/v1  # Base URL override
# api_key: sk-...                      # API key override
# workspace: /path/to/project      # Default workspace directory

# ── Per-Persona Overrides ────────────────────────────────────────────────────
# Each persona inherits the global settings above.
# Override only what differs — unset fields fall back to global.

# personas:
#   bolt:
#     model: gemini-2.5-flash       # Bolt uses a fast model (performance scanning)
#
#   sentinel:
#     endpoint: openai-prod         # Sentinel uses OpenAI for security analysis
#     model: gpt-4o
#
#   palette:
#     model: gemini-2.5-pro         # Palette uses a bigger model for UX reasoning
